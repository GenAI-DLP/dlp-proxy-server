syntax = "proto3";
package dlp;
option go_package = "github.com/GenAI-DLP/dlp-proxy-server/internal/dlpclient/pb";

service DLPInspector {
  rpc Inspect (InspectRequest) returns (Verdict);
}

message InspectRequest {
  string session_id = 1;
  string direction  = 2; // "input" | "output"
  string method     = 3;
  string path       = 4;
  map<string, string> headers = 5;
  bytes body        = 6;
}

message Verdict {
  string action           = 1; // "allow" | "block" | "transform"
  bytes transformed_body  = 2;
  string reason           = 3;
}